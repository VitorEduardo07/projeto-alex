<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Projeto Alex</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: modelo em tela cheia; ficha do projeto no canto superior esquerdo, ferramentas e camadas à direita, barra de vistas na base */
:root{
  --bg:#E8ECF0; --scene:#E3E8ED; --panel:rgba(255,255,255,.9); --fg:#1B2330; --muted:#5A6676;
  --line:#CCD3DB; --accent:#2D5C8A; --accent-fg:#FFFFFF; --model:#F4F2EE; --edge:#28303C; --ground:#D3D9E0;
  --font-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13171C; --scene:#161B21; --panel:rgba(26,32,40,.92); --fg:#E5E9EE; --muted:#9AA5B3;
  --line:#313A45; --accent:#86B4E2; --accent-fg:#0D1520; --model:#D8D5CE; --edge:#10151B; --ground:#222932; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#13171C; --scene:#161B21; --panel:rgba(26,32,40,.92); --fg:#E5E9EE; --muted:#9AA5B3;
  --line:#313A45; --accent:#86B4E2; --accent-fg:#0D1520; --model:#D8D5CE; --edge:#10151B; --ground:#222932; color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;overflow:hidden}
[hidden]{display:none!important}
#app{position:fixed;inset:0}
#app canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

.sheet{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  padding:14px 16px;max-width:min(320px,calc(100vw - 32px));display:grid;gap:4px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sheet h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1.1;text-wrap:balance}
.dims{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.dims b{color:var(--fg);font-weight:600}

.tools{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:260px}
.tools summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;border-radius:var(--radius)}
.tools summary::-webkit-details-marker{display:none}
.tools summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .2s}
.tools[open] summary::after{transform:rotate(-135deg) translateY(-2px)}
.tools summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tool-body{padding:12px 14px 14px;display:grid;gap:14px;border-top:1px solid var(--line);
  max-height:calc(100vh - 170px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto}
.section-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.section-title button{font:500 12px var(--font-body);color:var(--accent);background:none;border:0;padding:2px 0;cursor:pointer;letter-spacing:0;text-transform:none}
.section-title button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.field{display:grid;gap:6px}
.field-head{display:flex;justify-content:space-between;font-size:13px}
.field-head span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;cursor:pointer}
.switch input{accent-color:var(--accent);width:16px;height:16px;margin:0;flex:none}
.layers{display:grid;gap:9px}
.layer .swatch{width:10px;height:10px;border-radius:3px;flex:none;border:1px solid var(--line)}
.layer .name{display:flex;align-items:center;gap:8px;min-width:0}
.layer .count{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;margin-left:auto;padding-right:2px}
.divider{height:1px;background:var(--line)}

.views{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.views .card{display:flex;gap:4px;padding:5px;overflow-x:auto;max-width:100%;pointer-events:auto;scrollbar-width:none}
.views button{font:500 13px var(--font-body);color:var(--fg);background:transparent;border:0;border-radius:7px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.views button:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.views button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.views button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.views .sep{width:1px;background:var(--line);margin:4px 2px;flex:none}

.hint{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));
  padding:10px 12px;font-size:12px;color:var(--muted);line-height:1.6;transition:opacity .5s}
.hint b{color:var(--fg);font-weight:600}
.hint.gone{opacity:0;pointer-events:none}

.status{position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:10px;font-size:14px;color:var(--muted);text-align:center;padding:0 24px}
.bar{width:200px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

@media (max-width:720px){
  .sheet h1{font-size:20px}
  .sheet{padding:10px 12px}
  .tools{width:auto;max-width:calc(100vw - 32px)}
  .tools:not([open]) summary{padding:10px 12px}
  .tools[open]{width:250px}
  .tools[open] .tool-body{max-height:calc(100vh - 230px)}
  .hint{display:none}
}
@media (max-width:720px) and (max-height:520px){ .sheet .dims{display:none} }
@media (prefers-reduced-motion: reduce){ .hint,.tools summary::after,.bar i{transition:none} }
</style>

<div id="app" aria-label="Modelo 3D"></div>

<div class="sheet card">
  <span class="eyebrow">Visualização 3D</span>
  <h1>Projeto Alex</h1>
  <span class="dims" id="dims">Carregando…</span>
</div>

<details class="tools card" id="tools" open>
  <summary>Ferramentas</summary>
  <div class="tool-body">
    <div class="section-title"><span>Camadas</span><button type="button" id="allLayers">Mostrar todas</button></div>
    <div class="layers" id="layers"></div>
    <div class="divider"></div>
    <div class="field">
      <div class="field-head"><label for="cut">Corte de altura</label><span id="cutVal">sem corte</span></div>
      <input type="range" id="cut" min="0" max="100" value="100">
    </div>
    <div class="field">
      <div class="field-head"><label for="sunHour">Posição do sol</label><span id="sunVal">10:00</span></div>
      <input type="range" id="sunHour" min="6" max="18" step="0.25" value="10">
    </div>
    <label class="switch" for="edges">Mostrar arestas <input type="checkbox" id="edges"></label>
    <label class="switch" for="shadows">Sombras <input type="checkbox" id="shadows" checked></label>
    <label class="switch" for="spin">Girar automaticamente <input type="checkbox" id="spin"></label>
  </div>
</details>

<nav class="views" aria-label="Vistas">
  <div class="card" id="viewBar">
    <button type="button" data-view="iso" aria-pressed="true">Perspectiva</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" data-view="front" aria-pressed="false">Frente</button>
    <button type="button" data-view="back" aria-pressed="false">Fundos</button>
    <button type="button" data-view="left" aria-pressed="false">Esquerda</button>
    <button type="button" data-view="right" aria-pressed="false">Direita</button>
    <button type="button" data-view="top" aria-pressed="false">Planta</button>
  </div>
</nav>

<div class="hint card" id="hint">
  <b>Arrastar</b> gira o modelo<br>
  <b>Rolar / pinçar</b> aproxima ou afasta<br>
  <b>Botão direito / dois dedos</b> move a vista
</div>

<div class="status" id="status"><span id="statusText">Carregando modelo…</span><div class="bar"><i id="barFill"></i></div></div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const MODEL_URL = 'modelo.glb';
/* Cenas salvas no SketchUp (posição e direção da câmera, em metros) */
const SCENES = [{"name":"Cena2","pos":[7.7217,1.6158,57.8485],"dir":[-0.0,-0.0,-1.0],"up":[0.0,1.0,-0.0]},{"name":"Cena3","pos":[-9.843,43.5747,-34.5062],"dir":[0.35032,-0.87249,0.34064],"up":[0.62553,0.48863,0.60824]},{"name":"Cena4","pos":[26.671,36.8328,9.6062],"dir":[-0.41244,-0.79103,-0.45185],"up":[-0.53328,0.61178,-0.58424]},{"name":"Cena5","pos":[-68.0349,2.2658,-12.2012],"dir":[1.0,-0.0,-0.0],"up":[0.0,1.0,0.0]},{"name":"Cena6","pos":[26.1709,7.3028,23.6099],"dir":[-0.44861,-0.09556,-0.8886],"up":[-0.04307,0.99542,-0.0853]}];
const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fail = (msg) => { $('statusText').textContent = msg; $('barFill').parentElement.hidden = true; };

let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
catch (e) { fail('Este navegador não conseguiu abrir o 3D. Tente pelo Chrome, Edge ou Safari atualizados.'); throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
const app = $('app');
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.screenSpacePanning = true;
controls.autoRotateSpeed = 0.8;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8f99a6, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

const clipPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 1e6);
const modelMat = new THREE.MeshStandardMaterial({ roughness: 0.85, metalness: 0, side: THREE.DoubleSide,
  polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1, clippingPlanes: [clipPlane] });
const edgeMat = new THREE.LineBasicMaterial({ clippingPlanes: [clipPlane], transparent: true, opacity: 0.7 });
const groundMat = new THREE.MeshStandardMaterial({ roughness: 1 });
const meshes = [];
let edgeLines = null;
let size = new THREE.Vector3(10, 5, 10), radius = 10;

function applyTheme() {
  scene.background = new THREE.Color(css('--scene'));
  modelMat.color.set(css('--model'));
  edgeMat.color.set(css('--edge'));
  groundMat.color.set(css('--ground'));
}
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

function resize() {
  const w = app.clientWidth, h = app.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(app);
resize();

/* ---------- camadas automáticas ----------
   O exportador não leva as tags do SketchUp. Cada objeto é classificado pelo nome
   do grupo/componente em que está (o mais externo que for reconhecido) e, se nenhum
   for, pelo nome do material. O que sobra fica em "Construção". */
const LAYERS = [
  { id: 'cobertura', label: 'Cobertura',            color: '#8A9BA8', re: /(telhad|cobertura|roof|telha\b)/i, mat: /(roof|telha|corrugated|corrogated)/i },
  { id: 'esquadria', label: 'Janelas e portas',     color: '#4D7FA8', re: /(janela|maxim|blindex|esquadri|window|door|porta|basculante|vitr[oô])/i },
  { id: 'portao',    label: 'Portão',               color: '#7A6A58', re: /(port[aã_]o|gate|^aste|motor)/i },
  { id: 'banheiro',  label: 'Banheiro',             color: '#8D7BB0', re: /(banh|bannho|sanit|lixeira|papeleira|celite|bathroom|chuveir|lavat|cuba|torneira|tanque|bacia|piccolo|toalh)/i },
  { id: 'cozinha',   label: 'Cozinha e eletros',    color: '#C0874F', re: /(cook|fog[aã]o|microondas|geladeira|refriger|depurador|coifa|forno|kitchen|cozinha|frigobar|lava.?lou)/i },
  { id: 'mobilia',   label: 'Móveis e decoração',   color: '#B08A4D', re: /(sofa|sofá|mesa|cadeira|cama|travesseiro|armari|rack|poltrona|roma_|movel|móvel|tapete|cortina|aparador|banqueta|estante|nicho|decor|quadro|livro|bandeja|difusor|orange|almofad)/i },
  { id: 'iluminacao',label: 'Iluminação',           color: '#D4B24C', re: /(lumin|pendente|lustre|spot|arandela|lamp|plafon)/i, mat: /(lumin|lampara|lâmpada)/i },
  { id: 'vegetacao', label: 'Vegetação e vasos',    color: '#5E8C4A', re: /(veget|folh|leaf|leave|arvore|árvore|planta|buchinho|vaso\+com|tree|bush|palm)/i, mat: /(veget|folh|leaf|bark|saguaro|fig\d|palm)/i },
  { id: 'terreno',   label: 'Terreno e piso externo', color: '#9C8F78', re: /(terreno|cal[cç]ada|gramado)/i, mat: /(asphalt|soil|grass|grama|paver|cobble|terra\b)/i },
  { id: 'cerca',     label: 'Muros, cercas e grades', color: '#6C7780', re: /(fenc|cerca|gradil|grade\b|muro)/i, mat: /fenc/i },
  { id: 'veiculo',   label: 'Veículos',             color: '#B4534B', re: /\b(atto|carro|veic|moto)/i },
];
const BASE = { id: 'construcao', label: 'Construção', color: '#A39C90' };
const byName = (txt) => (txt ? LAYERS.find((l) => l.re.test(txt)) : null);
const byMat = (o) => {
  const mats = Array.isArray(o.material) ? o.material : [o.material];
  for (const m of mats) { const hit = m && m.name && LAYERS.find((l) => l.mat && l.mat.test(m.name)); if (hit) return hit; }
  return null;
};

function buildLayers(container) {
  const groups = new Map();
  const put = (layer, mesh) => {
    if (!groups.has(layer.id)) groups.set(layer.id, { ...layer, meshes: [] });
    groups.get(layer.id).meshes.push(mesh);
  };
  const walk = (node, inherited) => {
    const cat = inherited || byName(node.name);
    if (node.isMesh) { put(cat || byMat(node) || BASE, node); return; }
    node.children.forEach((c) => { if (!c.isLineSegments) walk(c, cat); });
  };
  container.children.forEach((c) => walk(c, null));

  const order = [BASE.id, ...LAYERS.map((l) => l.id)];
  const list = [...groups.values()].sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
  const box = $('layers');
  box.innerHTML = '';
  list.forEach((g) => {
    const id = 'layer-' + g.id;
    const row = document.createElement('label');
    row.className = 'switch layer'; row.htmlFor = id;
    row.innerHTML = `<span class="name"><span class="swatch" style="background:${g.color}"></span>${g.label}</span><input type="checkbox" id="${id}" checked>`;
    row.querySelector('input').addEventListener('change', (e) => g.meshes.forEach((m) => (m.visible = e.target.checked)));
    box.appendChild(row);
  });
  $('allLayers').onclick = () => box.querySelectorAll('input').forEach((i) => { if (!i.checked) { i.checked = true; i.dispatchEvent(new Event('change')); } });
  window.__layers = list;
}

/* ---------- modelo ---------- */
const sceneCams = [];
function setup(root) {
  root.updateMatrixWorld(true);
  let box = new THREE.Box3().setFromObject(root);
  const c = box.getCenter(new THREE.Vector3());
  root.position.x -= c.x; root.position.z -= c.z; root.position.y -= box.min.y;
  root.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(root);
  size = box.getSize(new THREE.Vector3());
  radius = box.getBoundingSphere(new THREE.Sphere()).radius;

  let textured = 0;
  root.traverse((o) => {
    if (!o.isMesh) return;
    const list = Array.isArray(o.material) ? o.material : [o.material];
    const own = list.some((m) => m && (m.map || (m.name && m.name.length)));
    if (own) {
      textured++;
      list.forEach((m) => { m.side = THREE.DoubleSide; m.clippingPlanes = [clipPlane]; });
    } else o.material = modelMat;
    o.castShadow = true; o.receiveShadow = true;
    meshes.push(o);
  });
  const showEdges = textured < meshes.length * 0.5;
  $('edges').checked = showEdges;
  if (showEdges) setEdges(true);
  scene.add(root);

  let container = root;
  while (container.children.length === 1 && !container.children[0].isMesh) container = container.children[0];
  if (SCENES.length) {
    SCENES.forEach((c) => sceneCams.push({ name: c.name, pos: new THREE.Vector3(...c.pos).add(root.position), dir: new THREE.Vector3(...c.dir).normalize() }));
  } else {
    container.children.forEach((n) => {
      if (!/^cena\s*\d+/i.test(n.name)) return;
      sceneCams.push({ name: n.name, pos: n.getWorldPosition(new THREE.Vector3()),
        dir: new THREE.Vector3(0, 0, -1).applyQuaternion(n.getWorldQuaternion(new THREE.Quaternion())) });
    });
    sceneCams.sort((a, b) => a.name.localeCompare(b.name, 'pt-BR', { numeric: true }));
  }
  buildLayers(container);
  addSceneButtons();

  const ground = new THREE.Mesh(new THREE.CircleGeometry(radius * 2.2, 96), groundMat);
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.01; ground.receiveShadow = true;
  scene.add(ground);

  const sc = sun.shadow.camera, r = radius * 1.1;
  sc.left = -r; sc.right = r; sc.top = r; sc.bottom = -r; sc.near = 0.1; sc.far = radius * 8;
  sc.updateProjectionMatrix();
  camera.near = Math.max(radius / 800, 0.02); camera.far = radius * 60; camera.updateProjectionMatrix();
  controls.maxDistance = radius * 8;
  controls.minDistance = 0.2;

  const f = (v) => v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  $('dims').innerHTML = `Volume aprox. <b>${f(size.x)} × ${f(size.z)} m</b> · altura <b>${f(size.y)} m</b>`;

  updateSun(); updateCut();
  goTo('iso', true);
  $('status').hidden = true;
}

function setEdges(on) {
  if (on && !edgeLines) {
    edgeLines = [];
    meshes.forEach((m) => { const l = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry, 30), edgeMat); m.add(l); edgeLines.push(l); });
  }
  if (edgeLines) edgeLines.forEach((l) => (l.visible = on));
}

/* ---------- vistas ---------- */
const DIRS = {
  iso:   new THREE.Vector3(1.1, 0.85, 1.4),
  front: new THREE.Vector3(0, 0.12, 1),
  back:  new THREE.Vector3(0, 0.12, -1),
  left:  new THREE.Vector3(-1, 0.12, 0),
  right: new THREE.Vector3(1, 0.12, 0),
  top:   new THREE.Vector3(0, 1, 0.0001),
};
let tween = null;
function fitDistance() {
  const v = THREE.MathUtils.degToRad(camera.fov) / 2;
  const h = Math.atan(Math.tan(v) * camera.aspect);
  return Math.max(radius / Math.sin(v), radius / Math.sin(h)) * 0.85;
}
function markView(name) {
  document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === name)));
}
function flyTo(pos, target, instant) {
  if (instant || reduceMotion) { camera.position.copy(pos); controls.target.copy(target); controls.update(); tween = null; return; }
  tween = { t0: performance.now(), dur: 900, p0: camera.position.clone(), q0: controls.target.clone(), p1: pos, q1: target };
}
function goTo(name, instant) {
  markView(name);
  if (name.startsWith('cena:')) {
    const cam = sceneCams[+name.slice(5)];
    const pos = cam.pos.clone(), dir = cam.dir;
    const center = new THREE.Vector3(0, size.y * 0.4, 0);
    const t = THREE.MathUtils.clamp(center.clone().sub(pos).dot(dir), 2, radius * 1.5);
    return flyTo(pos, pos.clone().addScaledVector(dir, t), instant);
  }
  const target = new THREE.Vector3(0, name === 'top' ? 0 : size.y * 0.3, 0);
  flyTo(DIRS[name].clone().normalize().multiplyScalar(fitDistance()).add(target), target, instant);
}
function addSceneButtons() {
  if (!sceneCams.length) return;
  const bar = $('viewBar');
  const sep = document.createElement('span'); sep.className = 'sep'; sep.setAttribute('aria-hidden', 'true');
  bar.appendChild(sep);
  sceneCams.forEach((n, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.dataset.view = 'cena:' + i; b.setAttribute('aria-pressed', 'false');
    b.textContent = n.name.replace(/^cena\s*(\d+)/i, 'Cena $1');
    bar.appendChild(b);
  });
}
$('viewBar').addEventListener('click', (e) => { const b = e.target.closest('[data-view]'); if (b) goTo(b.dataset.view); });
controls.addEventListener('start', () => { tween = null; markView(''); $('hint').classList.add('gone'); });

/* ---------- ferramentas ---------- */
function updateCut() {
  const p = +$('cut').value;
  if (p >= 100) { clipPlane.constant = 1e6; $('cutVal').textContent = 'sem corte'; return; }
  const h = size.y * p / 100;
  clipPlane.constant = h;
  $('cutVal').textContent = h.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' m';
}
function updateSun() {
  const hour = +$('sunHour').value;
  const t = (hour - 6) / 12 * Math.PI;
  const dir = new THREE.Vector3(Math.cos(t), Math.sin(t) * 1.1 + 0.12, 0.55).normalize();
  sun.position.copy(dir.multiplyScalar(radius * 3));
  sun.target.position.set(0, 0, 0);
  sun.intensity = 0.8 + 1.4 * Math.sin(t);
  const hh = Math.floor(hour), mm = Math.round((hour - hh) * 60);
  $('sunVal').textContent = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
}
$('cut').addEventListener('input', updateCut);
$('sunHour').addEventListener('input', updateSun);
$('edges').addEventListener('change', (e) => setEdges(e.target.checked));
$('shadows').addEventListener('change', (e) => { sun.castShadow = e.target.checked; });
$('spin').addEventListener('change', (e) => { controls.autoRotate = e.target.checked; });
if (matchMedia('(max-width:720px)').matches) $('tools').open = false;

/* ---------- carregar ---------- */
async function load() {
  const res = await fetch(MODEL_URL);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const total = +res.headers.get('content-length') || 0;
  let buf;
  if (total && res.body) {
    const reader = res.body.getReader(); const parts = []; let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      parts.push(value); got += value.length;
      const pct = Math.min(100, Math.round(got / total * 100));
      $('barFill').style.width = pct + '%';
      $('statusText').textContent = `Carregando modelo… ${pct}%`;
    }
    const all = new Uint8Array(got); let o = 0; parts.forEach((p) => { all.set(p, o); o += p.length; });
    buf = all.buffer;
  } else buf = await res.arrayBuffer();
  $('statusText').textContent = 'Preparando a cena…';
  const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
  const gltf = await loader.parseAsync(buf, '');
  setup(gltf.scene);
}
load().catch((err) => { console.error(err); fail('Não foi possível abrir o modelo. Verifique a conexão e recarregue a página.'); });

const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
renderer.setAnimationLoop(() => {
  if (tween) {
    const k = Math.min((performance.now() - tween.t0) / tween.dur, 1), e = ease(k);
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.q0, tween.q1, e);
    if (k >= 1) tween = null;
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
