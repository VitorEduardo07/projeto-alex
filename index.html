<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Projeto Alex 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: modelo em tela cheia; ficha do projeto no canto superior esquerdo, ferramentas à direita, barra de vistas na base */
:root{
  --bg:#E8ECF0; --scene:#E3E8ED; --panel:rgba(255,255,255,.88); --fg:#1B2330; --muted:#5A6676;
  --line:#CCD3DB; --accent:#2D5C8A; --accent-fg:#FFFFFF; --model:#F4F2EE; --edge:#28303C; --ground:#D3D9E0;
  --font-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gap:12px; --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13171C; --scene:#161B21; --panel:rgba(26,32,40,.9); --fg:#E5E9EE; --muted:#9AA5B3;
  --line:#313A45; --accent:#86B4E2; --accent-fg:#0D1520; --model:#D8D5CE; --edge:#10151B; --ground:#222932; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#13171C; --scene:#161B21; --panel:rgba(26,32,40,.9); --fg:#E5E9EE; --muted:#9AA5B3;
  --line:#313A45; --accent:#86B4E2; --accent-fg:#0D1520; --model:#D8D5CE; --edge:#10151B; --ground:#222932; color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;overflow:hidden}
[hidden]{display:none!important}
#app{position:fixed;inset:0}
#app canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

.sheet{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  padding:14px 16px;max-width:min(320px,calc(100vw - 32px));display:grid;gap:4px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sheet h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1.1;text-wrap:balance}
.dims{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.dims b{color:var(--fg);font-weight:600}

.tools{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:250px}
.tools summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;border-radius:var(--radius)}
.tools summary::-webkit-details-marker{display:none}
.tools summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .2s}
.tools[open] summary::after{transform:rotate(-135deg) translateY(-2px)}
.tools summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tool-body{padding:2px 14px 14px;display:grid;gap:14px;border-top:1px solid var(--line);padding-top:12px}
.field{display:grid;gap:6px}
.field-head{display:flex;justify-content:space-between;font-size:13px}
.field-head span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.switch{display:flex;align-items:center;justify-content:space-between;font-size:13px;cursor:pointer}
.switch input{accent-color:var(--accent);width:16px;height:16px;margin:0}

.views{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.views .card{display:flex;gap:4px;padding:5px;overflow-x:auto;max-width:100%;pointer-events:auto;scrollbar-width:none}
.views button{font:500 13px var(--font-body);color:var(--fg);background:transparent;border:0;border-radius:7px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.views button:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.views button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.views button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.views .sep{width:1px;background:var(--line);margin:4px 2px;flex:none}

.hint{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));
  padding:10px 12px;font-size:12px;color:var(--muted);line-height:1.6;transition:opacity .5s}
.hint b{color:var(--fg);font-weight:600}
.hint.gone{opacity:0;pointer-events:none}

.status{position:fixed;inset:0;display:grid;place-items:center;font-size:14px;color:var(--muted)}

@media (max-width:720px){
  .sheet h1{font-size:20px}
  .sheet{padding:10px 12px}
  .tools{width:auto;max-width:calc(100vw - 32px)}
  .tools:not([open]) summary{padding:10px 12px}
  .tools[open]{width:240px;top:auto;bottom:calc(74px + env(safe-area-inset-bottom,0px))}
  .hint{display:none}
}
@media (max-width:720px) and (max-height:520px){ .sheet .dims{display:none} }
@media (prefers-reduced-motion: reduce){ .hint,.tools summary::after{transition:none} }
</style>

<div id="app" aria-label="Modelo 3D do Projeto Alex"></div>

<div class="sheet card">
  <span class="eyebrow">Visualização 3D</span>
  <h1>Projeto Alex</h1>
  <span class="dims" id="dims">Carregando…</span>
</div>

<details class="tools card" id="tools" open>
  <summary>Ferramentas</summary>
  <div class="tool-body">
    <div class="field">
      <div class="field-head"><label for="cut">Corte de altura</label><span id="cutVal">sem corte</span></div>
      <input type="range" id="cut" min="0" max="100" value="100">
    </div>
    <div class="field">
      <div class="field-head"><label for="sunHour">Posição do sol</label><span id="sunVal">10:00</span></div>
      <input type="range" id="sunHour" min="6" max="18" step="0.25" value="10">
    </div>
    <label class="switch" for="edges">Mostrar arestas <input type="checkbox" id="edges" checked></label>
    <label class="switch" for="shadows">Sombras <input type="checkbox" id="shadows" checked></label>
    <label class="switch" for="spin">Girar automaticamente <input type="checkbox" id="spin"></label>
  </div>
</details>

<nav class="views" aria-label="Vistas">
  <div class="card">
    <button type="button" data-view="iso" aria-pressed="true">Perspectiva</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" data-view="front" aria-pressed="false">Frente</button>
    <button type="button" data-view="back" aria-pressed="false">Fundos</button>
    <button type="button" data-view="left" aria-pressed="false">Esquerda</button>
    <button type="button" data-view="right" aria-pressed="false">Direita</button>
    <button type="button" data-view="top" aria-pressed="false">Planta</button>
  </div>
</nav>

<div class="hint card" id="hint">
  <b>Arrastar</b> gira o modelo<br>
  <b>Rolar / pinçar</b> aproxima ou afasta<br>
  <b>Botão direito / dois dedos</b> move a vista
</div>

<div class="status" id="status">Carregando modelo…</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const statusEl = $('status');

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (e) {
  statusEl.textContent = 'Este navegador não conseguiu abrir o 3D. Tente pelo Chrome, Edge ou Safari atualizados.';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
const app = $('app');
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.screenSpacePanning = true;
controls.autoRotateSpeed = 0.8;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8f99a6, 1.15));
const sun = new THREE.DirectionalLight(0xffffff, 2.1);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

const clipPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 1e6);
const modelMat = new THREE.MeshStandardMaterial({ roughness: 0.85, metalness: 0, side: THREE.DoubleSide,
  polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1, clippingPlanes: [clipPlane] });
const edgeMat = new THREE.LineBasicMaterial({ clippingPlanes: [clipPlane], transparent: true, opacity: 0.85 });
const groundMat = new THREE.MeshStandardMaterial({ roughness: 1 });
const edgeLines = [];
const meshes = [];
let size = new THREE.Vector3(10, 5, 10), radius = 10, ground;

function applyTheme() {
  scene.background = new THREE.Color(css('--scene'));
  modelMat.color.set(css('--model'));
  edgeMat.color.set(css('--edge'));
  groundMat.color.set(css('--ground'));
}
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

function resize() {
  const w = app.clientWidth, h = app.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}

/* ---------- modelo ---------- */
function setup(root) {
  root.updateMatrixWorld(true);
  let box = new THREE.Box3().setFromObject(root);
  const c = box.getCenter(new THREE.Vector3());
  root.position.x -= c.x; root.position.z -= c.z; root.position.y -= box.min.y;
  root.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(root);
  size = box.getSize(new THREE.Vector3());
  radius = box.getBoundingSphere(new THREE.Sphere()).radius;

  root.traverse((o) => {
    if (!o.isMesh) return;
    const m = o.material;
    const hasOwnLook = m && (m.map || (m.name && m.name.length));
    if (hasOwnLook) { m.side = THREE.DoubleSide; m.clippingPlanes = [clipPlane]; }
    else o.material = modelMat;
    o.castShadow = true; o.receiveShadow = true;
    meshes.push(o);
    const lines = new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry, 25), edgeMat);
    o.add(lines); edgeLines.push(lines);
  });
  scene.add(root);

  ground = new THREE.Mesh(new THREE.CircleGeometry(radius * 2.2, 96), groundMat);
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.002; ground.receiveShadow = true;
  scene.add(ground);

  const sc = sun.shadow.camera, r = radius * 1.4;
  sc.left = -r; sc.right = r; sc.top = r; sc.bottom = -r; sc.near = 0.1; sc.far = radius * 8;
  sc.updateProjectionMatrix();

  camera.near = Math.max(radius / 500, 0.01); camera.far = radius * 60; camera.updateProjectionMatrix();

  const f = (v) => v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  updateSun(); updateCut();
  goTo('iso', true);
  statusEl.hidden = true;

const DIRS = {

  front: new THREE.Vector3(0, 0.12, 1),
  back:  new THREE.Vector3(0, 0.12, -1),
  left:  new THREE.Vector3(-1, 0.12, 0),

  const v = THREE.MathUtils.degToRad(camera.fov) / 2;

  document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === name)));
  if (instant || reduceMotion) { camera.position.copy(pos); controls.target.copy(target); controls.update(); tween = null; return; }
  tween = { t0: performance.now(), dur: 750, p0: camera.position.clone(), q0: controls.target.clone(), p1: pos, q1: target };
}
document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => goTo(b.dataset.view)));
controls.addEventListener('start', () => {
  tween = null;
  document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', 'false'));
  $('hint').classList.add('gone');
});

/* ---------- ferramentas ---------- */
function updateCut() {
  const p = +$('cut').value;
  if (p >= 100) { clipPlane.constant = 1e6; $('cutVal').textContent = 'sem corte'; return; }
  const h = size.y * p / 100;
  clipPlane.constant = h;
  $('cutVal').textContent = h.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' m';
}
function updateSun() {
  const hour = +$('sunHour').value;
  const t = (hour - 6) / 12 * Math.PI;
  const dir = new THREE.Vector3(Math.cos(t), Math.sin(t) * 1.1 + 0.12, 0.55).normalize();
  sun.position.copy(dir.multiplyScalar(radius * 3));
  sun.target.position.set(0, 0, 0);
  sun.intensity = 0.9 + 1.4 * Math.sin(t);
  const hh = Math.floor(hour), mm = Math.round((hour - hh) * 60);
  $('sunVal').textContent = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
}
$('cut').addEventListener('input', updateCut);
$('sunHour').addEventListener('input', updateSun);
$('edges').addEventListener('change', (e) => edgeLines.forEach((l) => (l.visible = e.target.checked)));
$('shadows').addEventListener('change', (e) => { sun.castShadow = e.target.checked; });
$('spin').addEventListener('change', (e) => { controls.autoRotate = e.target.checked; });
if (matchMedia('(max-width:720px)').matches) $('tools').open = false;

/* ---------- carregar ---------- */
try {
  const b64 = $('glb').textContent.trim();
  const bin = Uint8Array.from(atob(b64), (ch) => ch.charCodeAt(0));
  new GLTFLoader().parse(bin.buffer, '', (gltf) => setup(gltf.scene),
    (err) => { statusEl.textContent = 'Não foi possível abrir o modelo.'; console.error(err); });
} catch (err) { statusEl.textContent = 'Não foi possível abrir o modelo.'; console.error(err); }

const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
renderer.setAnimationLoop(() => {
  if (tween) {
    const k = Math.min((performance.now() - tween.t0) / tween.dur, 1), e = ease(k);
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.q0, tween.q1, e);
    if (k >= 1) tween = null;
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
